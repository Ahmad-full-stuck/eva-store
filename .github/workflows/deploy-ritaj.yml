name: Deploy Ritaj Al Arabi Store

on:
  workflow_dispatch:

concurrency:
  group: ritaj-al-arabi-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PORT: "5173"
      BASE_PATH: "/"
    steps:
      - name: Checkout Ritaj branch
        uses: actions/checkout@v4
        with:
          ref: ritaj-al-arabi
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            artifacts/eva-fabrics-store
            artifacts/eva-worker
            data
            lib
          sparse-checkout-cone-mode: true

      - name: Sanitize Cloudflare credentials
        run: |
          set -e
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Cloudflare API credentials are missing."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/eva-fabrics-store... --filter @workspace/eva-worker...

      - name: Typecheck storefront
        run: pnpm --filter @workspace/eva-fabrics-store typecheck

      - name: Typecheck Ritaj Worker
        working-directory: artifacts/eva-worker
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Build full Eva Store application adapted for Ritaj
        run: pnpm --filter @workspace/eva-fabrics-store build
        env:
          PORT: "5173"
          BASE_PATH: "/"
          VITE_API_URL: "https://ritaj-al-arabi-store.eva-store.workers.dev"

      - name: Apply isolated Ritaj D1 migrations and catalogue seed
        working-directory: artifacts/eva-worker
        run: pnpm exec wrangler d1 migrations apply ritaj-al-arabi-db --remote --config wrangler.ritaj.jsonc

      - name: Deploy the complete Ritaj Worker and storefront assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/eva-worker
          command: deploy --config wrangler.ritaj.jsonc
