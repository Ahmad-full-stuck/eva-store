name: Deploy Ritaj Al Arabi Store

on:
  push:
    branches: [ritaj-al-arabi]
  workflow_dispatch:

concurrency:
  group: ritaj-al-arabi-deploy-optimized
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PORT: "5173"
      BASE_PATH: "/"
    steps:
      - name: Download only Ritaj source files (skip Eva's large media library)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request, concurrent.futures

          repo = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}/contents"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ritaj-storefront-build",
          }

          def listing(path):
              url = f"{api}/{path}?ref={ref}" if path else f"{api}?ref={ref}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.loads(response.read().decode())

          files = {}
          root_files = {x["name"]: x for x in listing("") if x["type"] == "file"}
          for name in ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.base.json", ".npmrc"]:
              if name in root_files:
                  files[root_files[name]["path"]] = root_files[name]

          def add_direct_files(path, allowed=None):
              for item in listing(path):
                  if item["type"] == "file" and (allowed is None or item["name"] in allowed):
                      files[item["path"]] = item

          def add_tree(path):
              queue = [path]
              while queue:
                  current = queue.pop()
                  for item in listing(current):
                      if item["type"] == "file":
                          files[item["path"]] = item
                      elif item["type"] == "dir":
                          queue.append(item["path"])

          # App source and configuration only. Large unused fabrics/photos/videos are excluded.
          app = "artifacts/eva-fabrics-store"
          add_direct_files(app, {"package.json", "index.html", "vite.config.ts", "tsconfig.json", "components.json"})
          add_tree(f"{app}/src")
          add_direct_files(f"{app}/public")
          add_tree(f"{app}/public/fonts")

          # Worker runtime, migrations and its isolated Ritaj configuration.
          worker = "artifacts/eva-worker"
          add_direct_files(worker, {"package.json", "tsconfig.json", "wrangler.ritaj.jsonc"})
          add_tree(f"{worker}/src")
          add_tree(f"{worker}/migrations")

          # Runtime product/category catalogue and the app's workspace API client.
          for name in ["categories.json", "products.json"]:
              path = f"data/{name}"
              parent = {x["name"]: x for x in listing("data") if x["type"] == "file"}
              if name in parent:
                  files[path] = parent[name]
          add_tree("lib/api-client-react")

          def download(pair):
              path, item = pair
              url = item.get("download_url")
              if not url:
                  raise RuntimeError(f"No download URL for {path}")
              req = urllib.request.Request(url, headers={"User-Agent": "ritaj-storefront-build"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              dest = pathlib.Path(path)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              return path, len(data)

          total = 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              for path, size in pool.map(download, files.items()):
                  total += size
          print(f"Downloaded {len(files)} selected files ({total:,} bytes); excluded Eva's unused product-photo/video library.")
          PY

      - name: Sanitize Cloudflare credentials
        run: |
          set -e
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Cloudflare API credentials are missing."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/eva-fabrics-store... --filter @workspace/eva-worker...

      - name: Typecheck storefront
        run: pnpm --filter @workspace/eva-fabrics-store typecheck

      - name: Typecheck Ritaj Worker
        working-directory: artifacts/eva-worker
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Build full Eva Store application adapted for Ritaj
        run: pnpm --filter @workspace/eva-fabrics-store build
        env:
          PORT: "5173"
          BASE_PATH: "/"
          VITE_API_URL: "https://ritaj-al-arabi-store.eva-store.workers.dev"

      - name: Apply isolated Ritaj D1 migrations and catalogue seed
        working-directory: artifacts/eva-worker
        run: pnpm exec wrangler d1 migrations apply ritaj-al-arabi-db --remote --config wrangler.ritaj.jsonc

      - name: Publish the storefront on the branded Ritaj Pages domain
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/eva-worker
          command: pages deploy ../eva-fabrics-store/dist/public --project-name ritaj-al-arabi --branch main

      - name: Deploy the complete Ritaj Worker and storefront assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/eva-worker
          command: deploy --config wrangler.ritaj.jsonc
