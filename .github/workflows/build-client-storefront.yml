name: Build client storefront app

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-client-storefront.yml"
      - "artifacts/client-platform/src/**"
      - "artifacts/client-platform/public/**"
      - "artifacts/client-platform/brand-public/**"
      - "artifacts/client-platform/index.html"
      - "artifacts/eva-fabrics-store/vite.client-stores.config.ts"
      - "artifacts/eva-fabrics-store/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-storefront-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Link the Eva workspace dependencies to the copied app
        run: ln -s ../eva-fabrics-store/node_modules artifacts/client-platform/node_modules
      - name: Build the shared Eva client platform
        run: pnpm --filter @workspace/eva-fabrics-store exec vite build --config vite.client-stores.config.ts
      - name: Publish compiled static bundle to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/client-platform/dist
          if ! git diff --cached --quiet; then
            git commit -m "Build compiled client storefront app"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
