name: Deploy Zaytoun storefront to Cloudflare Workers

on:
  push:
    branches:
      - zaytoun-demo
    paths:
      - 'zaytoun-demo/**'
      - 'artifacts/zaytoun-worker/**'
      - '.github/workflows/deploy-zaytoun-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zaytoun-cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only the storefront and its deployment config
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            zaytoun-demo
            artifacts/zaytoun-worker
          sparse-checkout-cone-mode: true
      - name: Stage the storefront assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/zaytoun-worker/public
          cp zaytoun-demo/index.html artifacts/zaytoun-worker/public/index.html
          test -s artifacts/zaytoun-worker/public/index.html
          echo "Staged storefront HTML ($(wc -c < artifacts/zaytoun-worker/public/index.html) bytes)."
      - name: Deploy static assets with current Wrangler
        working-directory: artifacts/zaytoun-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Verify the public storefront response
        shell: bash
        run: |
          set -euo pipefail
          URL="https://zaytoun-group-storefront-demo-2026.eva-store.workers.dev/"
          for attempt in 1 2 3 4 5 6 7 8; do
            status="$(curl --silent --show-error --location --max-time 20 --output /tmp/zaytoun-public.html --write-out '%{http_code}' "$URL" || true)"
            if [ "$status" = "200" ] && grep -Fq '<title>زيتون كروب | متجر الأداء الرياضي</title>' /tmp/zaytoun-public.html; then
              echo "Live URL returned HTTP 200 and the expected Zaytoun storefront title: $URL"
              exit 0
            fi
            echo "Attempt $attempt did not yet confirm the expected page (HTTP $status)."
            sleep 4
          done
          echo "::error::The Worker deployed, but the public URL did not return the expected storefront HTML."
          exit 1
