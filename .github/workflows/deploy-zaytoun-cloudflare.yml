name: Deploy Zaytoun storefront to Cloudflare Workers

on:
  push:
    branches:
      - zaytoun-demo
    paths:
      - 'zaytoun-demo/**'
      - 'artifacts/zaytoun-worker/**'
      - '.github/workflows/deploy-zaytoun-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zaytoun-cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only the storefront and its deployment config
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            zaytoun-demo
            artifacts/zaytoun-worker
          sparse-checkout-cone-mode: true
      - name: Stage the storefront assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/zaytoun-worker/public
          cp zaytoun-demo/index.html artifacts/zaytoun-worker/public/index.html
          test -s artifacts/zaytoun-worker/public/index.html
          echo "Staged storefront HTML ($(wc -c < artifacts/zaytoun-worker/public/index.html) bytes)."
      - name: Deploy a dedicated static-asset Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/zaytoun-worker
          command: deploy
