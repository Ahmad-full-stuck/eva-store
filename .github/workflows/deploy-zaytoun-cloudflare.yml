name: Deploy Zaytoun storefront to Cloudflare Pages

on:
  push:
    branches:
      - zaytoun-demo
    paths:
      - 'zaytoun-demo/**'
      - '.github/workflows/deploy-zaytoun-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zaytoun-cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: zaytoun-group-iraq
    steps:
      - name: Checkout the isolated demo branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::The existing Cloudflare API token or account ID secret is missing."
            exit 1
          fi
          echo "Cloudflare credentials are present."
      - name: Ensure a dedicated Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          PROJECTS="$(npx --yes wrangler@latest pages project list --json)"
          if ! printf '%s' "$PROJECTS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);const a=Array.isArray(x)?x:(x.result||[]);process.exit(a.some(p=>p.name==="zaytoun-group-iraq")?0:1)}catch(e){process.exit(2)}})'; then
            echo "Creating dedicated Pages project..."
            npx --yes wrangler@latest pages project create "$PAGES_PROJECT" --production-branch zaytoun-demo
          else
            echo "Dedicated Pages project already exists."
          fi
      - name: Deploy storefront assets
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy ./zaytoun-demo --project-name "$PAGES_PROJECT" --branch zaytoun-demo --commit-hash "$GITHUB_SHA" --commit-message "Zaytoun Group storefront demo"
          echo "Expected production URL: https://$PAGES_PROJECT.pages.dev"
