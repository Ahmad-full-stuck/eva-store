name: Deploy LAMHA storefront
on:
  push:
    branches: [lamha-eva-store]
  workflow_dispatch:
concurrency:
  group: lamha-eva-store-deploy-v2
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LAMHA_ADMIN_PIN: ${{ secrets.LAMHA_ADMIN_PIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply schema and seed the demo catalog
        working-directory: artifacts/eva-worker
        run: |
          pnpm exec wrangler d1 migrations apply lamha-eva-store-db --remote --config wrangler.jsonc
          cd ../.. && python tools/build_seed_sql.py
          cd artifacts/eva-worker && pnpm exec wrangler d1 execute lamha-eva-store-db --remote --file ../../data/seed.sql --config wrangler.jsonc
      - name: Build original Eva Store application with LAMHA branding
        run: pnpm --filter @workspace/eva-fabrics-store build
        env:
          PORT: "5173"
          BASE_PATH: "/"
          VITE_WHATSAPP_NUMBER: ""
          VITE_INSTAGRAM_URL: ""
          VITE_API_URL: "https://lamha-iq.eva-store.workers.dev"
      - name: Remove unused inherited fabric photography to keep this deployment lean
        run: rm -rf artifacts/eva-fabrics-store/dist/public/products artifacts/eva-fabrics-store/dist/public/videos artifacts/eva-fabrics-store/dist/public/home
      - name: Configure LAMHA admin PIN
        if: env.LAMHA_ADMIN_PIN != ''
        working-directory: artifacts/eva-worker
        run: printf '%s' "$LAMHA_ADMIN_PIN" | pnpm exec wrangler secret put ADMIN_PIN --config wrangler.jsonc
      - name: Deploy the LAMHA storefront and API together
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/eva-worker
          command: deploy
      - name: Smoke-test the live LAMHA storefront and API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://lamha-iq.eva-store.workers.dev'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
          let lastError
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const [page, products, categories] = await Promise.all([
                fetch(base + '/', { cache: 'no-store' }),
                fetch(base + '/api/products', { cache: 'no-store' }),
                fetch(base + '/api/categories', { cache: 'no-store' }),
              ])
              if (!page.ok) throw new Error('Homepage returned HTTP ' + page.status)
              if (!products.ok) throw new Error('Products API returned HTTP ' + products.status)
              if (!categories.ok) throw new Error('Categories API returned HTTP ' + categories.status)
              const html = await page.text()
              if (/SERVICE NOTICE|Temporarily Unavailable/i.test(html)) throw new Error('Maintenance page is being served instead of the storefront')
              const productData = await products.json()
              const categoryData = await categories.json()
              if (!Array.isArray(productData.data) || productData.data.length < 1) throw new Error('Products API returned no products')
              if (!Array.isArray(categoryData.data) || categoryData.data.length < 1) throw new Error('Categories API returned no categories')
              const script = html.match(/<script[^>]+src=["']([^"']+\.js)["']/i)?.[1]
              if (!script) throw new Error('Vite JavaScript bundle was not found in homepage HTML')
              const asset = await fetch(new URL(script, base), { cache: 'no-store' })
              if (!asset.ok) throw new Error('JavaScript bundle returned HTTP ' + asset.status)
              console.log(JSON.stringify({
                homepage: page.status,
                products: productData.data.length,
                categories: categoryData.data.length,
                javascriptBundle: asset.status,
              }))
              process.exit(0)
            } catch (error) {
              lastError = error
              console.log('Smoke test attempt ' + attempt + '/12: ' + (error instanceof Error ? error.message : String(error)))
              if (attempt < 12) await sleep(5000)
            }
          }
          throw lastError
          NODE
