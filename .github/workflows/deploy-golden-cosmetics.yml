name: Deploy Golden Cosmetics Glass to Worker g

on:
  push:
    branches: [golden-cosmetics]
    paths:
      - "artifacts/eva-fabrics-store/**"
      - "artifacts/eva-worker/**"
      - ".github/workflows/deploy-golden-cosmetics.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: golden-cosmetics-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: golden-cosmetics
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the EvaStore Glass storefront with Golden Cosmetics identity
        run: pnpm --filter @workspace/eva-fabrics-store build
        env:
          PORT: "5173"
          BASE_PATH: "/"
      - name: Apply isolated Golden D1 migrations
        working-directory: artifacts/eva-worker
        run: pnpm exec wrangler d1 migrations apply scoop-shop --remote --config wrangler.jsonc
      - name: Deploy Golden Cosmetics to g.eva-store.workers.dev
        working-directory: artifacts/eva-worker
        run: pnpm exec wrangler deploy --config wrangler.jsonc
