name: Deploy Zaytoun Group demo to GitHub Pages

on:
  push:
    branches:
      - zaytoun-demo
    paths:
      - 'zaytoun-demo/**'
      - '.github/workflows/deploy-zaytoun-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zaytoun-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout the isolated demo branch
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the Zaytoun storefront only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./zaytoun-demo
      - name: Deploy storefront
        id: deployment
        uses: actions/deploy-pages@v4
