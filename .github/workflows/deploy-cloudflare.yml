name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

env:
  PORT: "5173"
  BASE_PATH: "/"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MASHA_ADMIN_PIN: ${{ secrets.MASHA_ADMIN_PIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize Cloudflare credentials (strip pasted whitespace/newlines)
        run: |
          set -e
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          if [ -z "$TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN is empty after sanitizing — re-add the secret without spaces or line breaks"; exit 1; fi
          if [ -z "$ACCOUNT" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID is empty after sanitizing — re-add the secret"; exit 1; fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          echo "Credentials sanitized (token length: ${#TOKEN}, account: ${ACCOUNT:0:8}...)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront
        run: pnpm --filter @workspace/eva-fabrics-store build

      - name: Build Masha storefront for its isolated Worker
        run: pnpm --filter @workspace/masha-store build
        env:
          PORT: "5174"
          BASE_PATH: "/"
          VITE_MASHA_API_BASE_URL: "https://masha-store.eva-store.workers.dev"

      - name: Provision the dedicated Masha D1 database
        working-directory: artifacts/masha-worker
        run: node scripts/ensure-db.mjs

      - name: Apply Masha database migrations and seed its demo catalog
        working-directory: artifacts/masha-worker
        run: pnpm exec wrangler d1 migrations apply masha-store-db --remote --config wrangler.jsonc

      - name: Configure the Masha admin PIN secret when supplied
        if: env.MASHA_ADMIN_PIN != ''
        working-directory: artifacts/masha-worker
        run: printf '%s' "$MASHA_ADMIN_PIN" | pnpm exec wrangler secret put ADMIN_PIN --config wrangler.jsonc

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/eva-worker
          command: deploy

      - name: Deploy Masha Worker with its own D1 database
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/masha-worker
          command: deploy
