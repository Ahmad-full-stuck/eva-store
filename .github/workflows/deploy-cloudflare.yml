name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

env:
  PORT: "5173"
  BASE_PATH: "/"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize Cloudflare credentials (strip pasted whitespace/newlines)
        run: |
          set -e
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          if [ -z "$TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN is empty after sanitizing — re-add the secret without spaces or line breaks"; exit 1; fi
          if [ -z "$ACCOUNT" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID is empty after sanitizing — re-add the secret"; exit 1; fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          echo "Credentials sanitized (token length: ${#TOKEN}, account: ${ACCOUNT:0:8}...)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront
        run: pnpm --filter @workspace/eva-fabrics-store build

      - name: Ensure D1 database exists and bind its id
        run: |
          set -e
          ID=$(pnpm --filter @workspace/eva-worker exec wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const rows=JSON.parse(s);const db=Array.isArray(rows)?rows.find(r=>r&&r.name==='eva-store'):null;console.log(db?(db.uuid||db.id||''):'')}catch(e){console.log('')}})")
          if [ -z "$ID" ]; then
            echo "Creating D1 database eva-store..."
            OUT=$(pnpm --filter @workspace/eva-worker exec wrangler d1 create eva-store)
            echo "$OUT"
            ID=$(echo "$OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          fi
          if [ -z "$ID" ]; then echo "Could not resolve D1 database id"; exit 1; fi
          echo "Using D1 id: $ID"
          node -e "const fs=require('fs');const p='artifacts/eva-worker/wrangler.jsonc';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.d1_databases[0].database_id='$ID';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"

      - name: Apply D1 migrations
        run: pnpm --filter @workspace/eva-worker exec wrangler d1 migrations apply eva-store --remote

      - name: Seed catalog if empty
        run: |
          set -e
          COUNT=$(pnpm --filter @workspace/eva-worker exec wrangler d1 execute eva-store --remote --json --command "SELECT COUNT(*) AS c FROM products" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j[0]?.results?.[0]?.c ?? 0)}catch(e){console.log(0)}})")
          echo "Existing products: $COUNT"
          if [ "$COUNT" = "0" ]; then
            echo "Seeding catalog..."
            pnpm --filter @workspace/eva-worker exec wrangler d1 execute eva-store --remote --yes --file ../../data/seed.sql
          else
            echo "Catalog already populated, skipping seed."
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/eva-worker
          command: deploy