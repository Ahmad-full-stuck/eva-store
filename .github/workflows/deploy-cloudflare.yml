name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

env:
  PORT: "5173"
  BASE_PATH: "/"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront
        run: pnpm --filter @workspace/eva-fabrics-store build

      - name: Apply D1 migrations
        run: pnpm --filter @workspace/eva-worker exec wrangler d1 migrations apply eva-store --remote

      - name: Create R2 bucket (if missing)
        run: pnpm --filter @workspace/eva-worker exec wrangler r2 bucket create eva-media || true

      - name: Seed catalog if empty
        run: |
          set -e
          COUNT=$(pnpm --filter @workspace/eva-worker exec wrangler d1 execute eva-store --remote --json --command "SELECT COUNT(*) AS c FROM products" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j[0]?.results?.[0]?.c ?? 0)}catch(e){console.log(0)}})")
          echo "Existing products: $COUNT"
          if [ "$COUNT" = "0" ]; then
            echo "Seeding catalog..."
            pnpm --filter @workspace/eva-worker exec wrangler d1 execute eva-store --remote --yes --file ../../data/seed.sql
          else
            echo "Catalog already populated, skipping seed."
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/eva-worker
          command: deploy