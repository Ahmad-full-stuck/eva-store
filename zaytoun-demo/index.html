function openCart(){renderCart();openOverlay();el("cartDrawer").classList.add("open");el("cartDrawer").setAttribute("aria-hidden","false");document.body.style.overflow="hidden";el("closeCart").focus()}
function buildOrderMessage(form){var lines=["السلام عليكم زيتون كروب، أريد الاستفسار عن المنتجات التالية:",""];cart.forEach(function(row,i){var p=products.find(function(x){return x.id===row.id});lines.push((i+1)+". "+p.ar+" — الخيار: "+row.flavor+" — الكمية: "+row.qty)});lines.push("","الاسم: "+form.name,"رقم التواصل: "+form.phone,"منطقة التوصيل: "+form.area);if(form.note)lines.push("ملاحظة: "+form.note);lines.push("يرجى تأكيد السعر والتوفر وتفاصيل التوصيل قبل اعتماد الطلب.");return lines.join("\n")}
document.addEventListener("click",function(e){var p=e.target.closest("[data-product]");if(p){openProduct(p.dataset.product);return}var f=e.target.closest("[data-filter]");if(f){filter=f.dataset.filter;renderProducts();return}var cat=e.target.closest("[data-category]");if(cat){filter=cat.dataset.category;renderProducts();document.getElementById("products").scrollIntoView({behavior:"smooth"});return}var flavor=e.target.closest("[data-flavor]");if(flavor){selectedFlavor=flavor.dataset.flavor;el("flavorChoices").querySelectorAll("[data-flavor]").forEach(function(b){b.classList.toggle("active",b.dataset.flavor===selectedFlavor)});return}var qty=e.target.closest("[data-qty]");if(qty){selectedQty=Number(qty.dataset.qty);el("qtyChoices").querySelectorAll("[data-qty]").forEach(function(b){b.classList.toggle("active",Number(b.dataset.qty)===selectedQty)});return}var change=e.target.closest("[data-qty-change]");if(change){var i=Number(change.dataset.qtyChange);cart[i].qty+=Number(change.dataset.delta);if(cart[i].qty<1)cart.splice(i,1);updateCartCount();renderCart();return}var remove=e.target.closest("[data-remove]");if(remove){cart.splice(Number(remove.dataset.remove),1);updateCartCount();renderCart();return}if(e.target.closest("[data-close-modal]")||e.target===el("overlay")){closeAll();return}if(e.target.closest("[data-close-checkout]")){closeAll();return}});
el("filters").addEventListener("click",function(e){var b=e.target.closest("[data-filter]");if(b){filter=b.dataset.filter;renderProducts()}});
el("productSearch").addEventListener("input",function(e){query=e.target.value;renderProducts()});
el("searchFocus").addEventListener("click",function(){document.getElementById("products").scrollIntoView({behavior:"smooth"});setTimeout(function(){el("productSearch").focus()},350)});
el("openCart").addEventListener("click",openCart);el("closeCart").addEventListener("click",closeAll);el("overlay").addEventListener("click",closeAll);
el("modalAdd").addEventListener("click",function(){if(!activeProduct)return;addToCart(activeProduct,selectedFlavor,selectedQty);closeAll();openCart()});
el("checkoutBtn").addEventListener("click",function(){if(!cart.length)return;el("orderSummary").textContent="عدد الأصناف: "+cart.reduce(function(n,r){return n+r.qty},0)+" — السعر والتوفّر قيد التأكيد";el("checkoutModal").classList.add("open");el("checkoutModal").setAttribute("aria-hidden","false");el("cartDrawer").classList.remove("open");el("cartDrawer").setAttribute("aria-hidden","true");openOverlay();document.body.style.overflow="hidden";setTimeout(function(){el("customerName").focus()},100)});
el("checkoutForm").addEventListener("submit",function(e){e.preventDefault();var name=el("customerName").value.trim(),phone=el("customerPhone").value.trim(),area=el("customerArea").value,note=el("customerNote").value.trim();if(!name||!phone||!area){el("formError").classList.add("show");return}el("formError").classList.remove("show");var message=buildOrderMessage({name:name,phone:phone,area:area,note:note});var recipient=el("customerArea").value.indexOf("ديالى")===0?"9647723098099":WHATSAPP_BAGHDAD;var url="https://wa.me/"+recipient+"?text="+encodeURIComponent(message);window.open(url,"_blank","noopener,noreferrer");closeAll()});
el("menuBtn").addEventListener("click",function(){var open=el("mainNav").classList.toggle("open");el("menuBtn").setAttribute("aria-expanded",String(open))});el("mainNav").addEventListener("click",function(e){if(e.target.closest("a")){el("mainNav").classList.remove("open");el("menuBtn").setAttribute("aria-expanded","false")}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll()});
renderProducts();renderCart();
})();

/* Theme preference: daytime is the default, dark mode is an explicit choice. */
(function(){
 var root=document.documentElement,button=document.getElementById("themeToggle"),icon=document.getElementById("themeIcon"),metaTheme=document.querySelector('meta[name="theme-color"]');
 var saved=null;try{saved=localStorage.getItem("zaytoun-theme")}catch(e){}
 function setTheme(mode){var dark=mode==="dark";root.setAttribute("data-theme",dark?"dark":"light");root.style.colorScheme=dark?"dark":"light";if(metaTheme)metaTheme.setAttribute("content",dark?"#0a100d":"#f7f6f0");if(button){button.setAttribute("aria-label",dark?"تفعيل الوضع النهاري":"تفعيل الوضع الليلي");button.setAttribute("title",dark?"تفعيل الوضع النهاري":"تفعيل الوضع الليلي")}if(icon){icon.innerHTML=dark?'<path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/>':'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'} }
 setTheme(saved==="dark"?"dark":"light");
 if(button)button.addEventListener("click",function(){var next=root.getAttribute("data-theme")==="dark"?"light":"dark";setTheme(next);try{localStorage.setItem("zaytoun-theme",next)}catch(e){}});
})();
/* Failed third-party product photos never leave broken-image icons. */
(function(){
 var fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"><rect width="320" height="320" rx="24" fill="#e9eddf"/><path d="M105 210h110l-12-100h-86z" fill="#52752d" opacity=".18"/><path d="M125 105h70l14 105H111z" fill="#52752d"/><path d="M137 126h46" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="160" y="250" font-size="17" text-anchor="middle" fill="#34442b" font-family="Arial,sans-serif">ZAYTOUN GROUP</text></svg>');
 document.addEventListener("error",function(event){var img=event.target;if(!img||img.tagName!=="IMG"||img.dataset.imageFallback==="true")return;img.dataset.imageFallback="true";img.alt=img.alt||"صورة المنتج غير متاحة";img.src=fallback;img.removeAttribute("srcset");img.removeAttribute("fetchpriority")},true);
})();
